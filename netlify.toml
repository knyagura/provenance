# Netlify builds only the new Next.js app in web/. The old single-file app stays on GitHub Pages
# until the switch-over (build order step 7).
[build]
  base = "web"
  # Unit tests and type checks run before every build, so a failing change never goes live.
  command = "npm run tokens && npm run typecheck && npm test && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Netlify's Next.js adapter turns the build into pages and functions Netlify can serve.
# It is named explicitly because this project was linked before the app existed, so Netlify
# did not add it automatically, and without it every page returns 404. Unpinned on purpose:
# Netlify recommends taking the latest adapter on each build.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Listing photos are stored full-size in Supabase; Netlify's image CDN resizes them per screen (web/lib/images.ts).
[images]
  remote_images = ["https://tkjmnivvcrcqkqjywafb\\.supabase\\.co/storage/v1/object/public/.*"]
