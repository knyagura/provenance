<style>
  :root{
    --ink:#3E3B33;
    --ink-soft:#5E5A4F;
    --paper:#F3EEE7;
    --paper-light:#F9F7F3;
    --paper-deep:#EAE2D8;
    --seal:#9C5238;
    --seal-dark:#7E4229;
    --seal-soft:#DA9C7D;
    --seal-soft-dark:#CB8A69;
    --brass:#7E6450;
    --verified:#5C6A4B;
    --sage:#B7BFAA;
    --blush:#D4B49B;
    --line:#DDD3C6;
    --muted:#6F665A;
    --on-accent:#FFFFFF;
    --ink-fixed:#5E5A4F;
    --nav-bg:#5E5A4F;
    --nav-ink:#E9E2D6;
    --nav-active:#F2BFA3;
    --font-display:'Newsreader', serif;
    --font-sans:'IBM Plex Sans', -apple-system, sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  /* Dark theme: same semantic roles (ink=text, paper=background, seal/brass/verified=accents),
     recalibrated for a dark page instead of inverting every rule individually. --ink-fixed is
     deliberately absent here -- the camera viewfinder and a couple of fixed-dark badges stay
     the same charcoal-olive in either theme, which matches how real camera UIs/status chips behave. */
  [data-theme="dark"]{
    --ink:#EFE9DF;
    --ink-soft:#CFC6B8;
    --paper:#23211D;
    --paper-light:#2B2925;
    --paper-deep:#35322C;
    --seal:#E3A587;
    --seal-dark:#D18E6E;
    --seal-soft:#E3A587;
    --seal-soft-dark:#D18E6E;
    --brass:#D9BFA6;
    --verified:#A8B596;
    --sage:#4E5644;
    --blush:#5A4A3E;
    --line:#45413A;
    --muted:#B3A999;
    --on-accent:#23211D;
    --nav-bg:#1A1916;
    --nav-ink:#CFC6B8;
    --nav-active:#E3A587;
  }
  .theme-toggle{background:none; border:1px solid var(--line); border-radius:14px; width:34px; height:34px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink); flex:0 0 auto;}
  .theme-toggle svg{width:17px;height:17px;}
  .brand-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-sans);
    color:var(--ink);
    background:var(--paper);
    font-size:15px;
    line-height:1.5;
  }
  a{color:inherit;}
  button{font-family:var(--font-sans);cursor:pointer;}
  :focus-visible{outline:2px solid var(--seal); outline-offset:2px;}

  /* ---------- Mobile app shell: phone-width frame, sticky top bar, fixed bottom tab bar ---------- */
  .shell{display:flex; flex-direction:column; min-height:100vh; max-width:430px; margin:0 auto; background:var(--paper); box-shadow:0 0 0 1px var(--line);}
  .brand{padding:14px 18px 10px; border-bottom:1px solid var(--line); background:var(--paper-light); position:sticky; top:0; z-index:5;}
  .brand-mark{font-family:var(--font-display); font-size:20px; font-weight:600; letter-spacing:0.01em;}
  .brand-tag{font-family:var(--font-mono); font-size:10.5px; color:var(--muted); margin-top:2px;}

  .offline-banner{background:var(--brass); color:var(--on-accent); font-family:var(--font-mono); font-size:11px; text-align:center; padding:7px 10px; position:sticky; top:0; z-index:4;}
  .bottom-nav{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px; display:flex; justify-content:space-around; background:var(--nav-bg); border-top:1px solid var(--nav-bg); padding:7px 2px calc(7px + env(safe-area-inset-bottom)); z-index:5;}
  .bottom-nav-item{display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10px; color:var(--nav-ink); background:none; border:none; cursor:pointer; padding:4px 6px; font-family:var(--font-sans); flex:1;}
  .bottom-nav-item svg{width:19px;height:19px;}
  .bottom-nav-item.active{color:var(--nav-active);}

  /* ---------- Main ---------- */
  .main{flex:1; min-width:0; padding:18px 16px 86px; max-width:100%;}
  .screen{display:none;}
  .screen.active{display:block; animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){ .screen.active{animation:none;} .rec-dot.live{animation:none;} }

  .eyebrow{font-family:var(--font-mono); font-size:12px; color:var(--muted); margin:0 0 6px;}
  .eyebrow-row{display:flex; justify-content:space-between; align-items:baseline; margin:0 0 6px;}
  .eyebrow-row .ref{font-family:var(--font-mono); font-size:12px; color:var(--muted);}
  h1.page-title{font-family:var(--font-display); font-size:25px; font-weight:600; margin:0 0 6px; line-height:1.2;}
  .page-sub{color:var(--ink-soft); margin:0 0 28px; max-width:62ch;}
  .section-head{font-family:var(--font-display); font-size:21px; font-weight:600; margin:36px 0 12px;}
  .section-head:first-of-type{margin-top:0;}
  .hairline{border:none; border-top:1px solid var(--line); margin:28px 0;}

  .panel{border:1px solid var(--line); background:var(--paper-light); padding:22px 24px; margin-bottom:18px;}
  .panel-flush{padding:0; overflow:hidden;}

  .chip{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-family:var(--font-mono); padding:3px 9px; border:1px solid currentColor; border-radius:2px;}
  .chip--standard{color:var(--muted);}
  .chip--enhanced{color:#5A6B7A;}
  .chip--verified{color:var(--verified);}
  .chip--luxury{color:var(--brass);}
  .chip--ultra{color:#F7F4EF; background:var(--ink-fixed); border-color:var(--brass);}
  .chip--danger{color:var(--seal);}

  .btn{
    font-size:13.5px; padding:10px 18px; border:1px solid var(--ink); background:var(--ink); color:var(--paper-light);
    border-radius:2px; font-weight:500;
  }
  .btn:hover{background:var(--ink-soft);}
  .btn:disabled{opacity:0.35; cursor:not-allowed;}
  .btn--ghost{background:transparent; color:var(--ink); border:1px solid var(--line);}
  .btn--ghost:hover{background:var(--paper-deep);}
  .btn--seal{background:var(--seal-soft); border-color:var(--seal-soft); color:#2E2B25;}
  .btn--seal:hover{background:var(--seal-soft-dark); border-color:var(--seal-soft-dark);}
  .btn-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px;}

  code, .mono{font-family:var(--font-mono); font-size:0.93em;}

  /* ---------- Feed ---------- */
  .hero{display:flex; flex-direction:column; gap:18px; align-items:stretch; margin-bottom:8px;}
  .hero-copy{flex:1 1 auto;}
  .hero h1{font-family:var(--font-display); font-size:28px; font-weight:600; line-height:1.15; margin:0 0 10px; max-width:none;}
  .hero p{color:var(--ink-soft); max-width:46ch; margin:0 0 18px;}
  .hero-preview{flex:0 0 280px; border:1px solid var(--line); background:var(--paper-light);}
  .hero-preview-head{padding:10px 14px; border-bottom:1px solid var(--line); font-family:var(--font-mono); font-size:11px; color:var(--muted); display:flex; justify-content:space-between;}
  .hero-preview-body{padding:16px 14px;}

  .filter-row{display:flex; gap:8px; margin:30px 0 18px; flex-wrap:wrap;}
  .filter-pill{font-size:12.5px; font-family:var(--font-mono); padding:5px 12px; border:1px solid var(--line); border-radius:999px; color:var(--muted);}
  .filter-pill.on{border-color:var(--ink); color:var(--ink);}

  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); gap:16px;}
  .card{border:1px solid var(--line); background:var(--paper-light); text-align:left; padding:0; display:block;}
  .card:hover{border-color:var(--ink-soft);}
  .card.active{border-color:var(--seal); box-shadow:0 0 0 1px var(--seal);}
  .card-swatch{height:140px; position:relative; display:flex; align-items:flex-end; padding:10px; overflow:hidden;}
  .card-swatch .tier-tag{position:relative; z-index:2; font-family:var(--font-mono); font-size:10.5px; background:rgba(62,59,51,0.82); color:#F7F4EF; padding:3px 7px; border-radius:2px;}
  .card-art{position:absolute; inset:0; z-index:1; display:flex; align-items:center; justify-content:center; padding:14px 12px 32px; pointer-events:none;}
  .card-art svg{width:100%; height:100%; max-width:150px; max-height:106px;}
  .card-art img{width:100%; height:100%; object-fit:cover; object-position:center;}
  .item-art{position:absolute; inset:0; z-index:1; display:flex; align-items:center; justify-content:center; padding:22px; pointer-events:none;}
  .item-art svg{width:100%; height:100%; max-width:260px; max-height:170px;}
  .item-art img{width:100%; height:100%; object-fit:cover; object-position:center;}
  .photo-credit{position:absolute; right:8px; bottom:6px; z-index:2; font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.02em; color:rgba(62,59,51,0.55); background:rgba(249,247,243,0.78); padding:1px 5px; pointer-events:none;}
  .card-body{padding:12px 14px 16px;}
  .card-title{font-weight:500; font-size:14px; margin:0 0 2px;}
  .card-brand{color:var(--muted); font-size:12.5px; margin:0 0 8px;}
  .card-price{font-family:var(--font-display); font-size:19px; font-weight:600;}
  .card-id{font-family:var(--font-mono); font-size:10.5px; color:var(--muted); margin-top:6px;}

  /* ---------- Ledger / fee table ---------- */
  .ledger-row{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px;}
  .ledger-row:last-child{border-bottom:none;}
  .ledger-row .label{color:var(--ink-soft);}
  .ledger-row .val{font-family:var(--font-mono);}
  .ledger-total{display:flex; justify-content:space-between; padding-top:14px; margin-top:4px; border-top:1px solid var(--ink); align-items:baseline;}
  .ledger-total .label{font-family:var(--font-display); font-size:17px;}
  .ledger-total .val{font-family:var(--font-display); font-size:26px; font-weight:600;}

  /* ---------- Seal ---------- */
  .seal-badge{width:60px;height:60px;border-radius:50%; display:flex; align-items:center; justify-content:center; flex:0 0 auto; position:relative;}
  .seal-badge::after{content:''; position:absolute; inset:4px; border-radius:50%; border:1.5px dashed rgba(255,255,255,0.45);}
  .seal-badge svg{width:22px;height:22px;}
  .seal--intact{background:radial-gradient(circle at 35% 30%, #B8694B, var(--seal-dark)); color:#FFF8F2;}
  .seal--broken{background:var(--paper-deep); color:var(--seal); border:1.5px dashed var(--seal);}
  .seal--broken::after{display:none;}
  .seal--pending{background:transparent; border:1.5px dashed var(--line); color:var(--muted);}
  .seal--pending::after{display:none;}
  /* Wax-seal stamp: plays automatically whenever a badge renders in its "intact" state --
     a quick press-down-and-settle motion plus a brief impact ring, so sealing an order reads
     as an action happening, not just an icon silently switching state. */
  .seal-badge.seal--intact{animation:sealStampIn .5s cubic-bezier(.34,1.56,.64,1) both;}
  .seal-badge.seal--intact::before{content:''; position:absolute; inset:0; border-radius:50%; animation:sealImpactRing .65s ease-out .32s both; pointer-events:none;}
  @keyframes sealStampIn{
    0%{transform:scale(1.7) rotate(-10deg); opacity:0;}
    45%{transform:scale(0.9) rotate(3deg); opacity:1;}
    65%{transform:scale(1.08) rotate(-1.5deg);}
    82%{transform:scale(0.97) rotate(0.5deg);}
    100%{transform:scale(1) rotate(0deg);}
  }
  @keyframes sealImpactRing{
    0%{box-shadow:0 0 0 0 rgba(156,82,56,0.5);}
    100%{box-shadow:0 0 0 16px rgba(156,82,56,0);}
  }
  @media (prefers-reduced-motion: reduce){
    .seal-badge.seal--intact{animation:none;}
    .seal-badge.seal--intact::before{animation:none;}
  }
  .seal-row{display:flex; gap:14px; align-items:center;}
  .seal-row .meta{font-size:13px;}
  .seal-row .meta .code{font-family:var(--font-mono); font-size:12.5px; color:var(--muted);}

  /* ---------- Stamp ---------- */
  .stamp{
    display:inline-block; border:2px solid var(--seal); color:var(--seal); border-radius:3px;
    padding:4px 10px; font-family:var(--font-mono); font-size:12px; letter-spacing:0.08em;
    transform:rotate(-4deg); font-weight:500;
  }
  .stamp--brass{border-color:var(--brass); color:var(--brass);}
  .stamp--verified{border-color:var(--verified); color:var(--verified);}

  /* ---------- Steps ---------- */
  .flow-layout{display:grid; grid-template-columns:1.3fr 1fr; gap:28px; align-items:start;}
  @media (max-width:860px){ .flow-layout{grid-template-columns:1fr;} }
  .viewfinder{background:var(--ink-fixed); color:#EAE2D8; aspect-ratio:4/3; border-radius:3px; position:relative; display:flex; flex-direction:column; justify-content:space-between; padding:14px; overflow:hidden;}
  .viewfinder-top{display:flex; justify-content:space-between; align-items:center; font-family:var(--font-mono); font-size:12px;}
  .rec-dot{width:9px;height:9px;border-radius:50%; background:var(--seal); display:inline-block; margin-right:6px;}
  .rec-dot.live{animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.25;}}
  .viewfinder-center{font-family:var(--font-display); font-size:17px; text-align:center; color:#F7F4EF; padding:0 10px;}
  .viewfinder-bottom{font-family:var(--font-mono); font-size:11px; color:#9AA38B; display:flex; justify-content:space-between;}

  .step-list{list-style:none; margin:0; padding:0;}
  .step-item{display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--line);}
  .step-item:last-child{border-bottom:none;}
  .step-num{font-family:var(--font-mono); font-size:12px; width:22px;height:22px; border-radius:50%; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; flex:0 0 auto; margin-top:1px; color:var(--muted);}
  .step-item.done .step-num{background:var(--verified); border-color:var(--verified); color:var(--on-accent);}
  .step-item.current .step-num{border-color:var(--seal); color:var(--seal); font-weight:600;}
  .step-title{font-size:14px; font-weight:500;}
  .step-item.done .step-title{color:var(--muted); text-decoration:line-through; text-decoration-color:var(--line);}
  .step-desc{font-size:12.5px; color:var(--muted); margin-top:2px;}

  .evidence-log{margin-top:18px;}
  .evidence-log-head{font-family:var(--font-mono); font-size:11px; color:var(--muted); margin-bottom:8px; display:flex; justify-content:space-between;}
  .evidence-log-item{display:flex; gap:10px; font-size:12.5px; padding:7px 0; border-top:1px solid var(--line);}
  .evidence-log-item .t{font-family:var(--font-mono); color:var(--muted); flex:0 0 58px;}

  /* ---------- Payment ---------- */
  .pm-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:10px; margin:14px 0 18px;}
  .pm-option{border:1px solid var(--line); background:var(--paper-light); padding:14px 12px; text-align:left; cursor:pointer; display:flex; flex-direction:column; gap:4px;}
  .pm-option:hover{border-color:var(--ink-soft);}
  .pm-option.active{border-color:var(--seal); box-shadow:inset 0 0 0 1px var(--seal);}
  .pm-name{font-family:var(--font-display); font-size:16px;}
  .pm-type{font-family:var(--font-mono); font-size:10.5px; color:var(--muted); letter-spacing:0.03em; text-transform:uppercase;}
  .field-row{display:flex; flex-direction:column; gap:4px; margin-bottom:12px;}
  .field-row label{font-size:11.5px; color:var(--muted); font-family:var(--font-mono);}
  .field-row input{font-family:var(--font-mono); font-size:14px; padding:9px 10px; border:1px solid var(--line); background:var(--paper); color:var(--ink);}
  .field-row-split{display:flex; gap:12px;}
  .field-row-split .field-row{flex:1;}
  .shutter-row{display:flex; justify-content:center; margin:10px 0 2px;}
  .shutter-btn{width:60px;height:60px;border-radius:50%; background:#fff; border:3px solid var(--line); cursor:pointer; padding:0; box-shadow:0 2px 8px rgba(0,0,0,0.18);}
  .shutter-btn:hover{border-color:var(--ink-soft);}
  .shutter-btn:active{transform:scale(0.92);}
  .shutter-btn:disabled{opacity:0.35; cursor:not-allowed;}
  .shutter-captured{display:flex; align-items:center; gap:8px; justify-content:center; color:var(--ink-soft); font-family:var(--font-mono); font-size:11.5px;}
  .shutter-thumb{width:34px;height:34px;border-radius:4px; border:2px solid var(--verified); flex:0 0 auto;}
  .shutter-thumb-img{width:34px;height:34px;border-radius:4px; border:2px solid var(--verified); flex:0 0 auto; object-fit:cover;}
  .photo-thumb-grid{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0;}
  .photo-thumb{width:64px;height:64px;border-radius:4px; border:1px solid var(--line); object-fit:cover; background-size:cover; background-position:center;}
  /* Real camera feed sits as a background layer inside .viewfinder; the status text/shutter
     controls get position:relative so they still paint on top of it (see note in build-notes
     memory re: default static-vs-positioned paint order). */
  .viewfinder{overflow:hidden;}
  .camera-feed{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; background:#000;}
  .viewfinder > *{position:relative; z-index:1;}
  .cam-cancel-row{display:flex; justify-content:center; margin-top:6px;}
  .cam-cancel-link{background:none; border:none; color:var(--muted); font-family:var(--font-mono); font-size:11px; text-decoration:underline; cursor:pointer; padding:4px;}
  .qr-thumb{width:46px;height:46px;background:#fff;border:1px solid var(--line);border-radius:3px;padding:3px;flex:0 0 auto;object-fit:contain;}
  .cam-open-row{display:flex; justify-content:center; margin:10px 0 2px;}
  .cam-open-btn{background:#fff; color:var(--ink); border:none; border-radius:20px; padding:11px 20px; font-family:var(--font-sans); font-size:13.5px; font-weight:500; cursor:pointer; display:inline-flex; align-items:center; gap:7px;}
  .cam-open-btn:active{transform:scale(0.97);}
  .cam-open-btn svg{width:16px;height:16px;}
  .cam-caption{text-align:center; color:var(--muted); font-family:var(--font-mono); font-size:11px; margin-top:9px;}
  .cam-controls{margin-top:14px;}
  .viewfinder > .cam-flash{position:absolute; inset:0; background:#fff; z-index:2; animation:camFlash .45s ease-out forwards; pointer-events:none;}
  @keyframes camFlash{0%{opacity:0.85;} 100%{opacity:0;}}
  @keyframes thumbPopIn{0%{transform:scale(0.35); opacity:0;} 55%{transform:scale(1.1); opacity:1;} 100%{transform:scale(1);}}
  .photo-thumb, .shutter-thumb, .shutter-thumb-img{animation:thumbPopIn .4s cubic-bezier(.34,1.56,.64,1) both;}
  @media (prefers-reduced-motion: reduce){
    .viewfinder > .cam-flash{animation:none; display:none;}
    .photo-thumb, .shutter-thumb, .shutter-thumb-img{animation:none;}
  }
  .scan-status{font-family:var(--font-mono); font-size:11.5px; text-align:center; margin-top:6px;}
  .scan-status.live{color:#EAE2D8;}
  .scan-status.mismatch{color:#E7A9A9;}
  .scan-status.ok{color:#9FE0B2;}

  /* ---------- Seller Storefront ---------- */
  .store-head{display:flex; gap:16px; align-items:flex-start; margin-bottom:16px;}
  .store-avatar{width:56px;height:56px;border-radius:50%; background:var(--brass); color:var(--on-accent); font-family:var(--font-display); font-size:22px; display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
  .store-name-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .store-name-row h1{margin:0; font-size:22px;}
  .store-badge{font-family:var(--font-mono); font-size:10.5px; letter-spacing:0.03em; padding:2px 7px; border:1px solid var(--verified); color:var(--verified); border-radius:3px;}
  .store-badge.pro{border-color:var(--brass); color:var(--brass);}
  .store-meta{font-size:12.5px; color:var(--muted); margin-top:4px;}
  .store-stats{display:flex; gap:18px; margin-top:8px; font-size:12.5px; color:var(--ink-soft);}
  .store-stats strong{color:var(--ink); font-family:var(--font-mono);}
  .store-tabs{display:flex; gap:0; border-bottom:1px solid var(--line); margin:18px 0 18px;}
  .store-tab{background:none; border:none; padding:10px 16px 10px 0; margin-right:16px; font-family:var(--font-sans); font-size:14px; color:var(--muted); border-bottom:2px solid transparent; cursor:pointer;}
  .store-tab.active{color:var(--ink); border-bottom-color:var(--seal); font-weight:500;}
  .store-listing-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:14px;}
  .store-listing-meta{font-size:11.5px; color:var(--muted); margin-top:4px;}
  .review-row{padding:14px 0; border-bottom:1px solid var(--line);}
  .review-row:last-child{border-bottom:none;}
  .review-head{display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted);}
  .review-stars{color:var(--brass); font-family:var(--font-mono); font-size:12.5px;}
  .review-text{font-size:13.5px; margin:6px 0 0; color:var(--ink-soft);}
  .review-reply{margin:8px 0 0 16px; padding:8px 12px; background:var(--paper); border-left:2px solid var(--brass); font-size:12.5px; color:var(--ink-soft);}
  .verified-row{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-soft); padding:4px 0;}
  .verified-row svg{width:14px;height:14px; color:var(--verified);}
  .store-owner-actions{display:flex; flex-wrap:wrap; gap:6px; padding:0 14px 14px;}
  .btn-mini{font-family:var(--font-sans); font-size:11.5px; padding:5px 9px; border:1px solid var(--line); background:var(--paper-light); cursor:pointer; color:var(--ink-soft);}
  .btn-mini:hover{border-color:var(--ink-soft); color:var(--ink);}
  .review-reply-form{margin:8px 0 0 16px; display:flex; flex-direction:column; gap:6px; max-width:420px;}
  .review-reply-form textarea{font-family:var(--font-sans); font-size:12.5px; padding:8px; border:1px solid var(--line); background:var(--paper-light); resize:vertical;}

  /* ---------- Proof Score ---------- */
  .proof-score{border:1px solid var(--line); background:var(--paper-light); padding:20px 24px; margin-bottom:18px;}
  .proof-score-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:4px;}
  .proof-score-label{font-family:var(--font-mono); font-size:11.5px; letter-spacing:0.06em; color:var(--muted); text-transform:uppercase;}
  .proof-score-value{font-family:var(--font-display); font-size:34px; line-height:1;}
  .proof-score-value .max{font-size:16px; color:var(--muted); font-family:var(--font-sans);}
  .proof-score-sub{font-size:12px; color:var(--muted); margin:2px 0 14px; max-width:62ch;}
  .proof-list{list-style:none; margin:0; padding:0;}
  .proof-row{display:flex; align-items:center; gap:10px; padding:5px 0; font-size:13px;}
  .proof-row .pr-icon{width:18px;height:18px;border-radius:50%; display:flex; align-items:center; justify-content:center; flex:0 0 auto; color:var(--muted);}
  .proof-row .pr-icon svg{width:11px;height:11px;}
  .proof-row.pr-done .pr-icon{background:var(--verified); color:var(--on-accent);}
  .proof-row.pr-pending .pr-icon{border:1.5px solid var(--seal); color:var(--seal);}
  .proof-row.pr-na{opacity:0.45;}
  .proof-row.pr-na .pr-icon{border:1.5px solid var(--line);}

  /* ---------- Timeline: animated evidence chain ---------- */
  .tl{position:relative; padding-left:30px; margin-top:14px;}
  .tl::before{content:''; position:absolute; left:7px; top:4px; bottom:4px; width:2px; background:var(--line); border-radius:1px;}
  .tl-line-fill{position:absolute; left:7px; top:4px; width:2px; background:var(--verified); border-radius:1px; height:0%; transition:height 1.1s cubic-bezier(.4,0,.2,1); box-shadow:0 0 6px rgba(92,106,75,0.55);}
  [data-theme="dark"] .tl-line-fill{box-shadow:0 0 8px rgba(168,181,150,0.7);}
  .tl-row{position:relative; padding-bottom:24px;}
  .tl-row::before{content:''; position:absolute; left:-30px; top:1px; width:13px;height:13px; border-radius:50%; background:var(--paper-light); border:2px solid var(--line); z-index:1; transition:background .4s, border-color .4s, box-shadow .4s;}
  .tl-row.done::before{background:var(--verified); border-color:var(--verified); box-shadow:0 0 0 3px rgba(92,106,75,0.18), 0 0 10px rgba(92,106,75,0.5);}
  .tl-row.current::before{background:var(--seal); border-color:var(--seal); box-shadow:0 0 0 3px rgba(156,82,56,0.18), 0 0 12px rgba(156,82,56,0.6); animation:tlPulse 1.6s ease-out infinite;}
  @keyframes tlPulse{
    0%{box-shadow:0 0 0 3px rgba(156,82,56,0.18), 0 0 0 0 rgba(156,82,56,0.55), 0 0 10px rgba(156,82,56,0.6);}
    70%{box-shadow:0 0 0 3px rgba(156,82,56,0.18), 0 0 0 9px rgba(156,82,56,0), 0 0 10px rgba(156,82,56,0.6);}
    100%{box-shadow:0 0 0 3px rgba(156,82,56,0.18), 0 0 0 9px rgba(156,82,56,0), 0 0 10px rgba(156,82,56,0.6);}
  }
  @media (prefers-reduced-motion: reduce){ .tl-row.current::before{animation:none;} }
  .tl-title{font-weight:500; font-size:14.5px;}
  .tl-row.done .tl-title{color:var(--ink);}
  .tl-row:not(.done):not(.current) .tl-title{color:var(--muted);}
  .tl-time{font-family:var(--font-mono); font-size:11.5px; color:var(--muted); margin-left:8px;}
  .tl-desc{font-size:12.5px; color:var(--ink-soft); margin-top:2px; max-width:56ch;}

  /* ---------- Passport ---------- */
  .passport-chain{border-left:1px solid var(--line); margin-left:6px; padding-left:22px;}
  .passport-owner{position:relative; padding-bottom:24px;}
  .passport-owner::before{content:''; position:absolute; left:-27px; top:3px; width:9px;height:9px; border-radius:50%; background:var(--brass);}
  .passport-owner h4{margin:0 0 2px; font-size:14.5px; font-family:var(--font-display);}
  .passport-owner .meta{font-family:var(--font-mono); font-size:11.5px; color:var(--muted);}
  .passport-owner p{margin:4px 0 0; font-size:13px; color:var(--ink-soft);}

  /* ---------- Dispute ---------- */
  .evidence-cols{display:grid; grid-template-columns:1fr 1fr; gap:0; border:1px solid var(--line);}
  .evidence-col{padding:18px 20px;}
  .evidence-col + .evidence-col{border-left:1px solid var(--line);}
  .evidence-col h4{font-family:var(--font-display); margin:0 0 10px; font-size:16px;}
  .evidence-col ul{margin:0; padding:0; list-style:none;}
  .evidence-col li{font-size:13px; padding:7px 0; border-top:1px solid var(--line);}
  .evidence-col li:first-child{border-top:none;}
  @media (max-width:720px){ .evidence-cols{grid-template-columns:1fr;} .evidence-col + .evidence-col{border-left:none; border-top:1px solid var(--line);} }

  .assistant-box{border:1px solid var(--brass); background:var(--paper-deep); padding:16px 20px; margin:18px 0;}
  .assistant-box .tag{font-family:var(--font-mono); font-size:11px; color:var(--brass); margin-bottom:6px; display:block;}
  .assistant-box p{margin:0 0 8px; font-size:13.5px; line-height:1.6;}
  .assistant-box p:last-child{margin-bottom:0;}

  .status-steps{display:flex; gap:0; margin:18px 0 6px;}
  .status-step{flex:1; text-align:left; border-top:3px solid var(--line); padding-top:10px; position:relative;}
  .status-step.done{border-top-color:var(--verified);}
  .status-step.current{border-top-color:var(--seal);}
  .status-step .n{font-family:var(--font-mono); font-size:11px; color:var(--muted); display:block; margin-bottom:3px;}
  .status-step .t{font-size:13px; font-weight:500;}

  /* ---------- Protection tiers ---------- */
  .tier-row{display:grid; grid-template-columns:140px 1fr 1fr; gap:24px; padding:20px 0; border-bottom:1px solid var(--line);}
  .tier-row:first-child{border-top:1px solid var(--line);}
  @media (max-width:760px){ .tier-row{grid-template-columns:1fr; gap:8px;} }
  .tier-row h4{margin:0 0 6px; font-family:var(--font-display); font-size:17px;}
  .tier-col-label{font-family:var(--font-mono); font-size:11px; color:var(--muted); margin-bottom:6px; display:block;}
  .tier-row ul{margin:0; padding-left:18px; font-size:13px; color:var(--ink-soft);}
  .tier-row li{margin-bottom:4px;}

  .risk-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; margin-top:14px;}
  @media (max-width:760px){ .risk-grid{grid-template-columns:1fr;} }
  .risk-card{border:1px solid var(--line); padding:16px;}
  .risk-card h5{margin:0 0 6px; font-family:var(--font-display); font-size:15px;}
  .risk-card p{margin:0; font-size:12.5px; color:var(--ink-soft);}

  .toast{position:fixed; bottom:24px; right:24px; background:var(--ink); color:var(--paper-light); padding:12px 18px; border-radius:3px; font-size:13px; max-width:300px; box-shadow:0 6px 18px rgba(0,0,0,.25); transform:translateY(20px); opacity:0; transition:all .25s ease; pointer-events:none; z-index:50;}
  .toast.show{transform:translateY(0); opacity:1;}
</style>
</head>

<div class="shell">
  <header class="brand">
    <div class="brand-row">
      <div>
        <div class="brand-mark">Provenance</div>
        <div class="brand-tag">Buy. Sell. Prove it.</div>
      </div>
      <button class="theme-toggle" id="themeToggleBtn" onclick="toggleDarkMode()" aria-label="Toggle dark mode"></button>
    </div>
  </header>
  <div class="offline-banner" id="offlineBanner" style="display:none;">You're offline — showing the installed app from cache. Anything you do now stays on this device.</div>
  <main class="main" id="main"></main>
  <nav class="bottom-nav" id="bottomnav"></nav>
</div>
<div class="toast" id="toast"></div>

// Badges are computed from real seller data, not static flags — same philosophy as
// dualVerifierRequired()/evidenceIntegrityOk() elsewhere: a badge should mean something
// re-checkable, not just a boolean someone set once.
const BADGE_DEFS = [
  {id:'verifiedSeller', label:'Verified Seller', test:(s)=> s.kycVerified && s.salesCount>=1},
  {id:'trustedSeller', label:'Trusted Seller', test:(s)=> s.kycVerified && s.salesCount>=25 && s.memberReviews.avg>=4.5 && s.autoReviews.avg>=4.5},
];
function sellerBadges(seller){ return BADGE_DEFS.filter(b=>b.test(seller)).map(b=>({id:b.id, label:b.label})); }

  stopScanLoop();
  goTo(CUSTODY_CAMERA[key].screen);
}
function sealsPairMatch(){
  return state.pairing.paired
    && state.pairing.proofSealCode === state.proofSeal.code
    && state.pairing.itemSealCode === state.itemSeal.code;
}

/* ============== FEES ============== */
const WITNESSED_OPENING_FEE = 7.50;
const WITNESSED_PACKING_FEE = 4.50;
function fees(item){
  // Enhanced is the floor for every listing — there's no cheaper, no-extra-verification tier below it.
  let rate=0.07, flat=1.20, auth=0, verifier=0;
  if(item.tier==='verified'){ rate=0.08; flat=1.20; }
  if(item.tier==='luxury'){ rate=0.10; auth=15; }
  if(item.tier==='ultraLuxury'){ rate=0.12; auth=20; }
  if(item.verifierHub){ verifier = dualVerifierRequired(item) ? 44 : 22; }
  const witnessedOpening = (item.sealEligible && state.addOns.witnessedOpening) ? WITNESSED_OPENING_FEE : 0;
  const witnessedPacking = (item.sealEligible && state.addOns.witnessedPacking) ? WITNESSED_PACKING_FEE : 0;
  const protection = Math.max(item.price*rate, 0.5) + flat;
  const sellerFee = item.price*0.08;
  // The seller can choose, at listing time, who pays for the services a price threshold
  // actually triggers (authentication + Verifier Hub) — not the baseline protection fee
  // every listing carries regardless of tier, just the extra tier-triggered ones. Existing
  // items never set protectionPayer, so sellerAbsorbsTriggered is false for them and this
  // changes nothing about their numbers.
  const sellerAbsorbsTriggered = item.protectionPayer === 'seller';
  const triggeredFees = auth + verifier;
  // Shipping is a buyer-time choice (Free vs Paid/express) rather than something baked into
  // the listing; state.shippingChoice is reset per order by freshState(). No choice yet (null)
  // means no shipping cost is added until the buyer actually picks one at checkout.
  const shippingCost = (state.shippingChoice === 'paid') ? item.shipping : 0;
  const buyerTotal = item.price + protection + shippingCost + witnessedOpening + witnessedPacking + (sellerAbsorbsTriggered ? 0 : triggeredFees);
  const sellerReceives = item.price - sellerFee - (sellerAbsorbsTriggered ? triggeredFees : 0);
  return {protection, sellerFee, auth, verifier, witnessedOpening, witnessedPacking, buyerTotal, sellerReceives, shippingCost, sellerAbsorbsTriggered, triggeredFees};
}
function setShippingChoice(choice){ state.shippingChoice = choice; }
function toggleWitnessedOpening(){
  state.addOns.witnessedOpening = !state.addOns.witnessedOpening;
  render('checkout');
}
function toggleWitnessedPacking(){
  state.addOns.witnessedPacking = !state.addOns.witnessedPacking;
  render('checkout');
}

// Five primary destinations, matching the bottom-tab pattern on real resale apps. Browse and
// Inbox are intentionally stubs (toast only) since those screens aren't built yet — everything
// else (item detail, checkout, handover, hub, unboxing, timeline, passport, disputes, protection,
// other sellers' storefronts) is still reachable contextually, it just isn't a top-level tab.
const BOTTOM_TABS = [
  {id:'home', label:'Home', screen:'feed', icon:iconHome, matches:(s)=> s==='feed'},
  {id:'browse', label:'Browse', screen:null, icon:iconBrowse, matches:()=>false},
  {id:'sell', label:'Sell', screen:'newlisting', icon:iconSell, matches:(s)=> s==='newlisting'},
  {id:'inbox', label:'Inbox', screen:null, icon:iconInbox, matches:()=>false},
  {id:'profile', label:'Profile', screen:'storefront', icon:iconProfile, matches:(s)=> s==='storefront' && state.viewingSellerId===MY_SELLER_ID},
];

function buildNav(){
  const nav = document.getElementById('bottomnav');
  nav.innerHTML = BOTTOM_TABS.map(t=>`<button class="bottom-nav-item" data-tab="${t.id}">${t.icon()}<span>${t.label}</span></button>`).join('');
  nav.querySelectorAll('.bottom-nav-item').forEach(el=>{
    const tab = BOTTOM_TABS.find(t=>t.id===el.dataset.tab);
    el.addEventListener('click', e=>{
      e.preventDefault();
      if(!tab.screen){ showToast(`${tab.label} arrives in a later pass.`); return; }
      if(tab.id==='profile'){ viewStorefront(MY_SELLER_ID); }
      goTo(tab.screen);
    });
  });
}

function goTo(screenId){
  // Any live camera stream belongs only to the screen that opened it — stop it before we
  // tear down that screen's <video> element. Screens that need the camera to keep running
  // (openListingCamera/openCustodyCamera) call goTo() first, then start a fresh stream
  // afterwards, so this never races with a camera that's meant to stay on.
  stopActiveCamera();
  document.querySelectorAll('.bottom-nav-item').forEach(el=>{
    const tab = BOTTOM_TABS.find(t=>t.id===el.dataset.tab);
    el.classList.toggle('active', !!(tab && tab.matches(screenId)));
  });
  render(screenId);
  window.scrollTo({top:0, behavior:'instant'});
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=> t.classList.remove('show'), 2600);
}

}

/* ============== SELLER HANDOVER FLOW ============== */
function buildHandoverSteps(it){
  const steps = [];
  steps.push({title:'Choose an approved drop-off point', desc:'Post Office, InPost locker or a Provenance partner store.'});
  const appAuthIdx = steps.length;
  steps.push({title:"Open the Provenance App and verify it's you", desc:'2FA at launch — a silent, device-bound key plus biometric confirmation (or a step-up ID + liveness re-scan if the device key is unavailable). This is the same KYC-verified account that listed the item, not just whoever is holding a camera, and the launch itself is written to a permanent authentication log every time, no exceptions.', bio:true});
  steps.push({title:'Start the protected recording', desc:'Recording begins at the counter — not at home.'});
  const challengeIdx = steps.length;
  steps.push({title:'Read the on-screen challenge code aloud', desc:`A one-time code issued the moment recording started (this leg: ${challengeCodeFor(state.handover,'challengeCode')}). Saying it on camera ties this exact footage to this exact moment — it can't appear in footage made before or after.`});
  const weighIdx = steps.length;
  steps.push({title:'Weigh the parcel and log it', desc:`Captured against the expected weight for this item (~${it.expectedWeightKg}kg). Checked automatically against the weight recorded at delivery — a mismatch flags for review without anyone having to ask for it.`});
  const itemSealIdx = it.pairedSeals ? steps.length : -1;
  steps.push(it.pairedSeals
    ? {title:'Fit and scan the Item Seal', desc:`A one-time, breakable NFC band fitted to ${it.sealAnchor}. Cutting it later breaks its circuit for good — it can't be reused or moved to another item.`}
    : {title:'Scan the Item Tag', desc:'Links this exact physical item to the order.'});
  steps.push({title:'Show the item on camera', desc:'Condition confirmed immediately before packing.', photo:true});
  const attendantInspectIdx = (it.sealEligible && state.addOns.witnessedPacking) ? steps.length : -1;
  if(attendantInspectIdx>=0){
    steps.push({title:'Drop-off attendant inspects before sealing', desc:'An independent member of staff — not the seller — looks the item over and confirms it matches the listing, before anything is packed.'});
  }
  const packIdx = steps.length;
  steps.push(it.pairedSeals
    ? {title:'Pack and pair the ProofSeal to the Item Seal', desc:"Both seals' codes are written into one shared pairing record against this order — not just applied around the same time, but linked as a single checkable pair."}
    : {title:'Pack and apply the ProofSeal', desc: it.verifierHub ? 'Addressed to the Verifier Hub, not the buyer directly.' : 'A single-use, transaction-specific seal.'});
  steps.push({title:'Show the sealed parcel on camera', desc:'Seal visibly intact before leaving your hands.', photo:true});
  const attendantSignIdx = (it.sealEligible && state.addOns.witnessedPacking) ? steps.length : -1;
  if(attendantSignIdx>=0){
    steps.push({title:'Attendant logs an independent confirmation', desc:"A short, separate note from the attendant that the parcel was packed and sealed as described — stored on its own record, not merged into the seller's recording."});
  }
  steps.push({title:'Hand the parcel to the carrier', desc: it.verifierHub ? `Routed to ${hubName(it)} for independent authentication.` : 'Staff acceptance is logged against this order.'});
  return {steps, appAuthIdx, challengeIdx, weighIdx, itemSealIdx, packIdx, attendantInspectIdx, attendantSignIdx};
}

function renderHandover(){
  const it = activeItem();
  if(!it.sealEligible){
    return `
    <div class="eyebrow">Seller handover</div>
    <h1 class="page-title">Enhanced tier — no Verified Handover needed</h1>
    <p class="page-sub">${it.title} is an Enhanced-tier item (${money(it.price)}). At this value, requiring a recorded drop-off would cost more than it protects — but it's never left with zero protection: the seller still records an Evidence Photo set at listing, and that's what your refund claim is checked against. The seller ships it as a normal tracked parcel.</p>
    <div class="panel"><p style="margin:0;font-size:13.5px;color:var(--ink-soft)">Want to see the full Verified Handover flow? <a href="#" onclick="selectItem('nike'); goTo('handover'); return false;">Switch to the Nike Air Max Terrascape example.</a></p></div>
    `;
  }
  const {steps, appAuthIdx, challengeIdx, weighIdx, itemSealIdx, packIdx, attendantInspectIdx, attendantSignIdx} = buildHandoverSteps(it);
  const h = state.handover;
  const stepsHtml = steps.map((s,i)=>{
    const cls = i<h.index ? 'done' : i===h.index ? 'current' : '';
    return `<li class="step-item ${cls}"><span class="step-num">${i<h.index?'✓':i+1}</span><div><div class="step-title">${s.title}</div><div class="step-desc">${s.desc}</div></div></li>`;
  }).join('');
  const finished = h.index >= steps.length;
  const sealState = finished || h.index>packIdx ? 'intact' : 'pending';
  const itemSealState = itemSealIdx>=0 ? (h.index>itemSealIdx ? 'intact' : 'pending') : null;
  const weighed = h.index > weighIdx;
  const attendantConfirmed = attendantSignIdx>=0 && finished;
  const appAuthDone = h.index > appAuthIdx;

  return `
  <div class="eyebrow-row"><span class="eyebrow" style="margin:0;">Seller handover</span><span class="ref">Order ${it.itemId.replace('IT','PRV')}</span></div>
  <h1 class="page-title">Verified Handover</h1>
  <p class="page-sub">${it.title}, ${money(it.price)}. ${it.verifierHub ? `Sealed for the Verifier Hub, ProofSeal` : 'ProofSeal'} <span class="mono">${state.proofSeal.code}</span>.</p>

  <div class="flow-layout">
    <div>
      <div class="viewfinder">
        ${h.cameraOn ? `<video id="handoverCameraView" autoplay playsinline muted class="camera-feed"></video>` : ''}
        ${h.justCaptured ? `<div class="cam-flash"></div>` : ''}
        <div class="viewfinder-top"><span>${h.cameraOn ? '<span class="rec-dot live"></span><span class="cam-live-label">STARTING…</span>' : (!finished && h.index>0 ? '<span class="rec-dot live"></span>REC' : '<span class="rec-dot"></span>STANDBY')}</span><span>${String(Math.min(h.index*18, 99)).padStart(2,'0')}s</span></div>
        <div class="viewfinder-center">${finished ? (it.verifierHub ? 'Handover complete — parcel in transit to the Verifier Hub' : 'Handover complete — evidence saved to this order') : steps[h.index].title}</div>
        <div class="viewfinder-bottom"><span>InPost Locker, Shoreditch</span><span>${it.itemId}</span></div>
      </div>
      <div class="cam-controls">
        ${(!finished && steps[h.index].photo) ? (h.photoCaptured[h.index] ? `<div class="shutter-row"><div class="shutter-captured">${h.photoDataUrls && h.photoDataUrls[h.index] ? `<img class="shutter-thumb-img" src="${h.photoDataUrls[h.index]}">` : `<span class="shutter-thumb" style="background:${it.swatch}"></span>`} Photo captured</div></div>` : (h.cameraOn
          ? `<div class="shutter-row"><button class="shutter-btn" onclick="snapCustodyPhoto('handover')" aria-label="Capture photo"></button></div><div class="cam-caption">Tap the shutter to capture</div><div class="cam-cancel-row"><button class="cam-cancel-link" onclick="cancelCustodyCamera('handover')">Cancel</button></div>`
          : `<div class="cam-open-row"><button class="cam-open-btn" onclick="openCustodyCamera('handover')">${iconCameraSmall()} Open Camera</button></div>`)) : ''}
      </div>
      <div class="btn-row">
        ${(!finished && steps[h.index].photo && !h.photoCaptured[h.index])
          ? `<button class="btn btn--ghost" disabled>Tap the shutter above to capture</button>`
          : (!finished && steps[h.index].bio && !h.bioConfirmed)
          ? `<button class="btn btn--seal" onclick="verifyBiometric('handover','Seller','order ${it.itemId}')">Verify with Face ID / Fingerprint</button>`
          : `<button class="btn ${finished?'btn--ghost':''}" ${finished?'disabled':''} onclick="handoverNext()">${finished? 'All steps complete' : (steps[h.index].photo ? 'Continue' : 'Complete this step')}</button>`}
        ${finished? (it.verifierHub ? `<button class="btn btn--seal" onclick="goTo('verifierhub')">Continue to Verifier Hub</button>` : `<button class="btn btn--seal" onclick="goTo('timeline')">View transaction timeline</button>`) : ''}
      </div>
    </div>
    <div>
      <ul class="step-list">${stepsHtml}</ul>
      ${appAuthDone ? `<p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 10px;">Seller identity confirmed via 2FA app launch — logged to the authentication audit log.</p>` : ''}
      <div class="seal-row" style="margin-top:18px;">
        <div class="seal-badge seal--${sealState}">${sealState==='intact'?iconCheck():iconDash()}</div>
        <div class="meta"><strong>ProofSeal ${state.proofSeal.code}</strong><br><span class="code">${sealState==='intact' ? (it.verifierHub ? 'Applied at handover. Linked to this leg only — it will be retired at the Verifier Hub.' : 'Applied at handover. Single-use, linked to this order.') : 'Not yet applied.'}</span></div>
      </div>
      ${itemSealState ? `<div class="seal-row" style="margin-top:10px;">
        <div class="seal-badge seal--${itemSealState}">${itemSealState==='intact'?iconCheck():iconDash()}</div>
        <div class="meta"><strong>Item Seal ${state.itemSeal.code}</strong><br><span class="code">${itemSealState==='intact' ? `Fitted to ${it.sealAnchor} and paired with the ProofSeal above — both codes written into one shared record. Only breaks if cut.` : `Not yet fitted to ${it.sealAnchor}.`}</span></div>
      </div>` : ''}
      ${weighed ? `<p style="font-size:12.5px;color:var(--ink-soft);margin:10px 0 0;">Parcel weighed at pack: <strong>${h.weighedKg}kg</strong> against an expected ${it.expectedWeightKg}kg.</p>` : ''}
      ${attendantSignIdx>=0 ? `<div style="margin-top:10px;padding:10px 12px;border:1px dashed var(--brass);border-radius:4px;background:rgba(126,100,80,0.06);">
        <div style="font-family:var(--font-mono);font-size:11px;color:var(--brass);letter-spacing:.03em;">ATTENDANT RECORD — separate from the seller's own recording</div>
        <div style="font-size:13px;margin-top:4px;">${attendantConfirmed ? 'Attendant confirmed the item matched the listing and the parcel was sealed as shown.' : 'Awaiting the attendant\'s independent sign-off.'}</div>
      </div>` : ''}
      ${h.log.length ? `<div class="evidence-log">
        <div class="evidence-log-head"><span>Evidence captured</span><span>${h.log.length} item${h.log.length>1?'s':''}</span></div>
        ${h.log.map(l=>`<div class="evidence-log-item"><span class="t">${l.t}</span><span>${l.text}</span></div>`).join('')}
      </div>`:''}
    </div>
  </div>
  `;
}

function handoverNext(){
  const it = activeItem();
  const {steps, appAuthIdx, weighIdx, attendantInspectIdx, attendantSignIdx} = buildHandoverSteps(it);
  const h = state.handover;
  if(h.index >= steps.length) return;
  const step = steps[h.index];
  if(h.index === appAuthIdx){
    launchApp('Seller', `order ${it.itemId}`, h.bioMethod);
    h.appAuth = true;
  }
  if(h.index === weighIdx){
    h.weighedKg = +(it.expectedWeightKg + (Math.random()*0.04-0.02)).toFixed(2);
  }
  if(h.index === attendantInspectIdx || h.index === attendantSignIdx){
    pushSignedLog(h, 'attendantLog', 'attendantHead', step.title, h.index*40000);
  } else {
    pushSignedLog(h, 'log', 'head', step.title, h.index*40000);
  }
  h.index++;
  if(h.index === steps.length){
    state.timeline.verified = true;
    state.timeline.packed = true;
    state.timeline.sealed = true;
    state.timeline.handedOver = true;
    if(!it.verifierHub){ state.timeline.shipped = true; }
    state.proofSeal.status = 'intact';
    scanSeal(state.proofSeal);
    if(it.pairedSeals){
      state.itemSeal.status = 'intact';
      scanSeal(state.itemSeal);
      // Register the pair as a shared record — the actual codes, not just two booleans.
      state.pairing.paired = true;
      state.pairing.proofSealCode = state.proofSeal.code;
      state.pairing.itemSealCode = state.itemSeal.code;
    }
    hapticPulse([10,40,10]);
    showToast(it.verifierHub ? 'Carrier acceptance logged. Parcel is in transit to the Verifier Hub.' : 'Carrier acceptance logged. Parcel is now in transit.');
  }
  render('handover');
}

/* ============== VERIFIER HUB FLOW ============== */
function buildVerifierHubSteps(it){
  const steps = [];
  steps.push({title:'Receive the sealed parcel', desc:"Arrival logged against this order the moment it's scanned in."});
  const appAuthIdx = steps.length;
  steps.push({title:"Hub technician opens the Provenance App and verifies it's them", desc:"Hub staff are KYC-verified accounts too — 2FA at launch (device key + biometric), logged to the permanent authentication audit log, every time.", bio:true});
  const itemSealIdx = it.pairedSeals ? steps.length : -1;
  const proofSealIdx = steps.length + (it.pairedSeals?1:0);
  steps.push({title:'Scan the incoming ProofSeal', desc:"Checked against the seal the seller applied, and confirmed intact.", scan:'proofSeal'});
  if(it.pairedSeals){
    steps.push({title:'Scan the paired Item Seal', desc:`Confirms the Item Seal on ${it.sealAnchor} is still intact and that its code still matches the pair registered at handover — proof the item itself wasn't swapped in transit, not just a visual check.`});
  }
  const challengeIdx = steps.length;
  steps.push({title:'Read the on-screen challenge code aloud', desc:`A fresh one-time code for this leg (${challengeCodeFor(state.verifierHub,'challengeCode')}), issued the moment the hub's recording started — ties this footage to this exact inspection.`});
  steps.push({title:'Open under recorded inspection', desc:'Examined on camera — nothing happens off-record.', photo:true});
  const authIdx = steps.length;
  steps.push({title:'Authenticate against reference data', desc:'Stitching, hardware stamps, date code and materials checked.'});
  const secondAuthIdx = dualVerifierRequired(it) ? steps.length : -1;
  if(secondAuthIdx>=0){
    steps.push({title:`Second independent authenticator reviews the item (${secondHubName(it)})`, desc:`Required by policy for every item over £${DUAL_VERIFIER_THRESHOLD.toLocaleString()} — not a spot-check. A separate hub, blind to the first hub's notes, re-examines the item and logs its own, independently-signed confirmation before the parcel is repacked.`});
  }
  const packIdx = steps.length;
  steps.push({title:'Repack and apply a new ProofSeal', desc:"The seller's parcel seal is retired. A new one is issued for the final leg. The Item Seal itself is left untouched — it stays with the item."});
  steps.push({title:'Hand the parcel to the carrier', desc:'Final leg to the buyer begins.'});
  return {steps, appAuthIdx, itemSealIdx, proofSealIdx, challengeIdx, authIdx, secondAuthIdx, packIdx};
}

  }).join('');
  const finished = v.index >= steps.length;

  const itemSealState = itemSealIdx>=0 ? (v.index>itemSealIdx ? 'intact' : 'pending') : null;
  const itemSealMatches = itemSealIdx>=0 ? sealsPairMatch() : null;
  const appAuthDone = v.index > appAuthIdx;
  const secondAuthDone = secondAuthIdx>=0 && v.index > secondAuthIdx;

  return `
  <div class="eyebrow-row"><span class="eyebrow" style="margin:0;">Verifier Hub</span><span class="ref">Order ${it.itemId.replace('IT','PRV')}</span></div>
  <h1 class="page-title">${hubName(it)}</h1>
  <p class="page-sub">${it.title} arrives sealed from the seller. An independent partner — not the seller, not the buyer — checks it before it continues.${dualVerifierRequired(it) ? ` Priced over £${DUAL_VERIFIER_THRESHOLD.toLocaleString()}, so a second independent authenticator (${secondHubName(it)}) is required too.` : ''}</p>

  <div class="flow-layout">
    <div>
      <div class="viewfinder">
        ${v.cameraOn ? `<video id="verifierHubCameraView" autoplay playsinline muted class="camera-feed"></video>` : ''}
        ${v.justCaptured ? `<div class="cam-flash"></div>` : ''}
        <div class="viewfinder-top"><span>${v.cameraOn ? '<span class="rec-dot live"></span><span class="cam-live-label">STARTING…</span>' : (!finished && v.index>0 ? '<span class="rec-dot live"></span>REC' : '<span class="rec-dot"></span>STANDBY')}</span><span>${String(Math.min(v.index*20, 99)).padStart(2,'0')}s</span></div>
        <div class="viewfinder-center">${finished ? 'Verification complete — re-sealed for final delivery' : steps[v.index].title}</div>
        <div class="viewfinder-bottom"><span>${hubName(it)}</span><span>${it.itemId}</span></div>
      </div>
      <div class="cam-controls">
        ${(!finished && steps[v.index].photo) ? (v.photoCaptured[v.index] ? `<div class="shutter-row"><div class="shutter-captured">${v.photoDataUrls && v.photoDataUrls[v.index] ? `<img class="shutter-thumb-img" src="${v.photoDataUrls[v.index]}">` : `<span class="shutter-thumb" style="background:${it.swatch}"></span>`} Photo captured</div></div>` : (v.cameraOn
          ? `<div class="shutter-row"><button class="shutter-btn" onclick="snapCustodyPhoto('verifierHub')" aria-label="Capture photo"></button></div><div class="cam-caption">Tap the shutter to capture</div><div class="cam-cancel-row"><button class="cam-cancel-link" onclick="cancelCustodyCamera('verifierHub')">Cancel</button></div>`
          : `<div class="cam-open-row"><button class="cam-open-btn" onclick="openCustodyCamera('verifierHub')">${iconCameraSmall()} Open Camera</button></div>`)) : ''}
        ${(!finished && steps[v.index].scan) ? (v.scanConfirmed && v.scanConfirmed[v.index] ? `<div class="scan-status ${v.scanMismatchCode && v.scanMismatchCode[v.index] ? 'mismatch' : 'ok'}">${v.scanMismatchCode && v.scanMismatchCode[v.index] ? `Scanned ${v.scanMismatchCode[v.index]} — does not match. Flagged for review.` : 'Scanned ✓ matches the expected seal'}</div>` : (v.cameraOn ? `<div class="scan-status live">Scanning for the seal's QR code…</div><div class="shutter-row"><button class="shutter-btn" onclick="snapScanAttempt('verifierHub','${steps[v.index].scan}')" aria-label="Capture scan"></button></div><div class="cam-caption">Tap the shutter to scan now</div><div class="cam-cancel-row"><button class="cam-cancel-link" onclick="confirmScanManually('verifierHub')">Can't scan it? Confirm manually</button></div><div class="cam-cancel-row"><button class="cam-cancel-link" onclick="cancelCustodyScan('verifierHub')">Cancel</button></div>` : `<div class="cam-open-row"><button class="cam-open-btn" onclick="openCustodyScan('verifierHub','${steps[v.index].scan}')">${iconCameraSmall()} Open Camera to Scan</button></div>`)) : ''}
      </div>
      <div class="btn-row">
        ${(!finished && steps[v.index].photo && !v.photoCaptured[v.index])
          ? `<button class="btn btn--ghost" disabled>Tap the shutter above to capture</button>`
          : (!finished && steps[v.index].scan && !(v.scanConfirmed && v.scanConfirmed[v.index]))
          ? `<button class="btn btn--ghost" disabled>Scan the seal above to continue</button>`
          : (!finished && steps[v.index].bio && !v.bioConfirmed)
          ? `<button class="btn btn--seal" onclick="verifyBiometric('verifierHub','Hub technician','${hubName(it)}, order ${it.itemId}')">Verify with Face ID / Fingerprint</button>`
          : `<button class="btn ${finished?'btn--ghost':''}" ${finished?'disabled':''} onclick="verifierHubNext()">${finished? 'All steps complete' : ((steps[v.index].photo||steps[v.index].scan) ? 'Continue' : 'Complete this step')}</button>`}
        ${finished? `<button class="btn btn--seal" onclick="goTo('unboxing')">Continue to buyer unboxing</button>`:''}
      </div>
    </div>
    <div>
      <ul class="step-list">${stepsHtml}</ul>
      ${appAuthDone ? `<p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 10px;">Hub technician identity confirmed via 2FA app launch — logged to the authentication audit log.</p>` : ''}
      <div class="seal-row" style="margin-top:18px;">
        <div class="seal-badge seal--${sellerSealState}">${sellerSealState==='intact'?iconCheck():iconDash()}</div>
        <div class="meta"><strong>Seller's ProofSeal ${state.proofSeal.code}</strong><br><span class="code">${sellerSealNote}</span></div>
        ${renderSealQr(state.proofSeal.code) ? `<img class="qr-thumb" src="${renderSealQr(state.proofSeal.code)}" alt="Scannable QR for ProofSeal ${state.proofSeal.code}" title="Real, scannable QR for this ProofSeal code">` : ''}

      ${itemSealState ? `<div class="seal-row" style="margin-top:10px;">
        <div class="seal-badge seal--${itemSealState}">${itemSealState==='intact'?iconCheck():iconDash()}</div>
        <div class="meta"><strong>Item Seal ${state.itemSeal.code}</strong><br><span class="code">${itemSealState==='intact' ? (itemSealMatches ? `Scanned on ${it.sealAnchor} — code matches the registered pair. Not removed; it stays with the item.` : `Scanned on ${it.sealAnchor} — code does NOT match the registered pair. Flagged.`) : 'Not yet scanned.'}</span></div>
      </div>` : ''}
      ${secondAuthIdx>=0 ? `<div style="margin-top:10px;padding:10px 12px;border:1px dashed var(--brass);border-radius:4px;background:rgba(126,100,80,0.06);">
        <div style="font-family:var(--font-mono);font-size:11px;color:var(--brass);letter-spacing:.03em;">SECOND AUTHENTICATOR — ${secondHubName(it)}</div>
        <div style="font-size:13px;margin-top:4px;">${secondAuthDone ? 'Independently confirmed the authentication, blind to the first hub\'s own notes, before the parcel was repacked.' : 'Required for this item — not yet reviewed.'}</div>
      </div>` : ''}
      <div class="seal-row" style="margin-top:10px;">
        <div class="seal-badge seal--${finished?'intact':'pending'}">${finished?iconCheck():iconDash()}</div>
        <div class="meta"><strong>New ProofSeal ${state.proofSealB.code}</strong><br><span class="code">${finished ? 'Issued and applied for the final leg to the buyer.' : 'Not yet issued.'}</span></div>

      ${v.log.length ? `<div class="evidence-log">
        <div class="evidence-log-head"><span>Evidence captured</span><span>${v.log.length} item${v.log.length>1?'s':''}</span></div>
        ${v.log.map(l=>`<div class="evidence-log-item"><span class="t">${l.t}</span><span>${l.text}</span></div>`).join('')}
      </div>`:''}
    </div>

function verifierHubNext(){
  const it = activeItem();
  const {steps, appAuthIdx, itemSealIdx, proofSealIdx, secondAuthIdx} = buildVerifierHubSteps(it);
  const v = state.verifierHub;
  if(v.index >= steps.length) return;
  const step = steps[v.index];
  if(v.index === appAuthIdx){
    launchApp('Hub technician', `${hubName(it)}, order ${it.itemId}`, v.bioMethod);
    v.appAuth = true;
  }
  if(v.index === proofSealIdx){ scanSeal(state.proofSeal); }
  if(v.index === itemSealIdx){ scanSeal(state.itemSeal); }
  if(v.index === secondAuthIdx){
    pushSignedLog(v, 'secondLog', 'secondHead', step.title, v.index*35000);
  } else {
    pushSignedLog(v, 'log', 'head', step.title, v.index*35000);
  }
  v.index++;
  if(v.index === steps.length){
    state.timeline.arrivedAtVerifier = true;
    state.timeline.hubAuthenticated = true;
    if(dualVerifierRequired(it)) state.timeline.secondHubAuthenticated = true;
    state.timeline.resealed = true;
    state.timeline.shipped = true;
    state.proofSealB.status = 'intact';
    scanSeal(state.proofSealB);
    showToast(dualVerifierRequired(it) ? 'Both independent authenticators signed off. Re-sealed and handed to the carrier for final delivery.' : 'Independent authentication complete. Re-sealed and handed to the carrier for final delivery.');
  }
  render('verifierhub');
}

/* ============== BUYER UNBOXING FLOW ============== */
function buildUnboxingSteps(it){
  const witnessed = it.sealEligible && state.addOns.witnessedOpening;
  const steps = [];
  const courierAppAuthIdx = witnessed ? steps.length : -1;
  if(witnessed){
    steps.push({title:"Courier opens their own Provenance App and confirms it's them", desc:"The courier's own KYC-verified account, 2FA'd at launch on their own device — a separate login from yours, logged to its own authentication audit trail."});
    steps.push({title:'Courier confirms and stays to witness', desc:'They remain on the doorstep until the parcel is opened and the seal checked, then log their own confirmation — independent of your recording.'});
  }
  const appAuthIdx = steps.length;
  steps.push({title:"Open the Provenance App and verify it's you", desc:"2FA at launch — silent device key plus biometric confirmation. Confirms this is the KYC-verified account that bought the item, logged permanently either way.", bio:true});
  steps.push({title:'Start the protected recording', desc:'Begin before touching the seal.'});
  const challengeIdx = steps.length;
  steps.push({title:'Read the on-screen challenge code aloud', desc:`A fresh one-time code for this unboxing (${challengeCodeFor(state.unboxing,'challengeCode')}). Saying it on camera ties this exact footage to this exact delivery.`});
  const weighIdx = steps.length;
  steps.push({title:'Weigh the parcel before opening', desc:`Checked automatically against the weight captured when it was handed to the carrier (~${it.expectedWeightKg}kg expected). A mismatch is flagged here, before the parcel is even opened — not asked for after the fact in a dispute.`});
  steps.push({title:'Show the parcel and shipping label', desc:'Confirms this is the right order.', photo:true});
  const proofSealIdx = steps.length;
  steps.push({title:'Scan the ProofSeal', desc:'Checked against the seal applied at handover.', scan:'proofSeal'});
  steps.push(
    {title:'Open the parcel on camera', desc:'No cuts or gaps off-camera.', photo:true},
    {title:'Show the item immediately', desc:'First look, uninterrupted.', photo:true},
  );
  let itemSealIdx = -1;
  if(it.pairedSeals){
    itemSealIdx = steps.length;
    steps.push(
      {title:"Scan the Item Seal — don't cut it yet", desc:`Confirms the seal on ${it.sealAnchor} is still intact and that its code still matches the pair registered at handover — not just a visual check.`},
      {title:'Photograph the item with the Item Seal still attached', desc:'Taken immediately after the scan, before you decide whether to remove it — your proof of exactly what arrived.', photo:true},
    );
  } else {
    steps.push({title:'Scan the Item Tag', desc:'Confirms this is the exact item that was sold.'});
  }
  const courierSignIdx = witnessed ? steps.length : -1;
  if(witnessed){
    steps.push({title:"Courier logs their own confirmation", desc:'A short, separate note from the courier that the parcel was opened and the contents matched what was expected — written to the courier\'s own log, from the courier\'s own app session, not merged into your recording.'});
  }
  return {steps, courierAppAuthIdx, appAuthIdx, challengeIdx, weighIdx, proofSealIdx, itemSealIdx, courierSignIdx, witnessed};
}

  const courierAppAuthDone = courierAppAuthIdx>=0 && u.index > courierAppAuthIdx;

        <div class="viewfinder-top"><span>${u.cameraOn ? '<span class="rec-dot live"></span><span class="cam-live-label">STARTING…</span>' : (!finished && u.index>0 ? '<span class="rec-dot live"></span>REC' : '<span class="rec-dot"></span>STANDBY')}</span><span>${String(Math.min(u.index*15, 90)).padStart(2,'0')}s</span></div>
        <div class="viewfinder-center">${finished ? 'Unboxing complete — order confirmed' : steps[u.index].title}</div>

        ${(!finished && steps[u.index].scan) ? (u.scanConfirmed && u.scanConfirmed[u.index] ? `<div class="scan-status ${u.scanMismatchCode && u.scanMismatchCode[u.index] ? 'mismatch' : 'ok'}">${u.scanMismatchCode && u.scanMismatchCode[u.index] ? `Scanned ${u.scanMismatchCode[u.index]} — does not match. Flagged for review.` : 'Scanned ✓ matches the expected seal'}</div>` : (u.cameraOn ? `<div class="scan-status live">Scanning for the seal's QR code…</div><div class="shutter-row"><button class="shutter-btn" onclick="snapScanAttempt('unboxing','${steps[u.index].scan}')" aria-label="Capture scan"></button></div><div class="cam-caption">Tap the shutter to scan now</div><div class="cam-cancel-row"><button class="cam-cancel-link" onclick="confirmScanManually('unboxing')">Can't scan it? Confirm manually</button></div><div class="cam-cancel-row"><button class="cam-cancel-link" onclick="cancelCustodyScan('unboxing')">Cancel</button></div>` : `<div class="cam-open-row"><button class="cam-open-btn" onclick="openCustodyScan('unboxing','${steps[u.index].scan}')">${iconCameraSmall()} Open Camera to Scan</button></div>`)) : ''}
      </div>
      <div class="btn-row">
        ${(!finished && steps[u.index].photo && !u.photoCaptured[u.index])

        ${renderSealQr(seal.code) ? `<img class="qr-thumb" src="${renderSealQr(seal.code)}" alt="Scannable QR for ProofSeal ${seal.code}" title="Real, scannable QR for this ProofSeal code">` : ''}
      </div>
      ${itemSealScanIdx!==null ? `<div class="seal-row" style="margin-top:10px;">
        <div class="seal-badge seal--${itemSealRescanned?'intact':'pending'}">${itemSealRescanned?iconCheck():iconDash()}</div>
        <div class="meta"><strong>Item Seal ${state.itemSeal.code}</strong><br><span class="code">${itemSealRescanned ? (itemSealMatches ? `Re-scanned on ${it.sealAnchor} — code matches the pair from handover.${itemSealPhotographed ? ' Photographed still attached.' : ''}` : `Re-scanned on ${it.sealAnchor} — code does NOT match the registered pair. Flagged.`) : `Fitted at handover to ${it.sealAnchor} — not yet re-scanned.`}</span></div>

      ${witnessed ? `<div style="margin-top:10px;padding:10px 12px;border:1px dashed var(--brass);border-radius:4px;background:rgba(126,100,80,0.06);">
        <div style="font-family:var(--font-mono);font-size:11px;color:var(--brass);letter-spacing:.03em;">COURIER'S OWN RECORD — separate app session, separate log</div>
        <div style="font-size:13px;margin-top:4px;">${witnessConfirmed ? 'Logged from the courier\'s own authenticated session — an independent human account that the parcel was opened and matched expectations.' : 'Courier present, waiting on the parcel to be opened.'}</div>
      </div>` : ''}
      ${u.log.length ? `<div class="evidence-log">
        <div class="evidence-log-head"><span>Evidence captured (your session)</span><span>${u.log.length} item${u.log.length>1?'s':''}</span></div>
        ${u.log.map(l=>`<div class="evidence-log-item"><span class="t">${l.t}</span><span>${l.text}</span></div>`).join('')}
      </div>`:''}
      ${u.courierLog.length ? `<div class="evidence-log" style="margin-top:10px;border-color:var(--brass);">
        <div class="evidence-log-head"><span>Courier's log (separate session)</span><span>${u.courierLog.length} item${u.courierLog.length>1?'s':''}</span></div>
        ${u.courierLog.map(l=>`<div class="evidence-log-item"><span class="t">${l.t}</span><span>${l.text}</span></div>`).join('')}
      </div>`:''}
      ${finished? `<p style="font-size:12.5px;color:var(--muted);margin-top:14px;">Something still wrong despite matching evidence? <a href="#" onclick="goTo('disputes'); return false;">Open the Dispute Centre.</a></p>` : ''}
    </div>

}

function unboxingNext(){
  const it = activeItem();
  const { steps, courierAppAuthIdx, appAuthIdx, weighIdx, proofSealIdx, itemSealIdx, courierSignIdx } = buildUnboxingSteps(it);
  const u = state.unboxing;
  if(u.index >= steps.length) return;
  const step = steps[u.index];
  const seal = buyerSeal(it);
  if(u.index === courierAppAuthIdx){
    launchApp('Courier', `order ${it.itemId} (Witnessed Opening)`);
    u.courierAppAuth = true;
  }
  if(u.index === appAuthIdx){
    launchApp('Buyer', `order ${it.itemId}`, u.bioMethod);
    u.appAuth = true;
  }
  if(u.index === weighIdx){
    u.weighedKg = +(it.expectedWeightKg + (Math.random()*0.04-0.02)).toFixed(2);
  }
  if(u.index === proofSealIdx){ scanSeal(seal); }
  if(u.index === itemSealIdx){ scanSeal(state.itemSeal); }
  if(u.index === courierSignIdx){
    pushSignedLog(u, 'courierLog', 'courierHead', step.title, u.index*30000);
  } else {
    pushSignedLog(u, 'log', 'head', step.title, u.index*30000);
  }
  u.index++;
  if(u.index === steps.length){
    state.timeline.delivered = true;
    state.timeline.unboxed = true;
    state.timeline.confirmed = true;
    showToast('Evidence matched. Order confirmed — funds released to seller.');
  }
  render('unboxing');
}

/* ============== TIMELINE ============== */
const TL_STEPS = [
  ['listed','Listed','Seller publishes the listing with its Item ID.'],
  ['purchased','Purchased','Buyer pays; funds held until the order is confirmed.'],
  ['verified','Item verified','Item condition and Item ID confirmed against the listing.'],
  ['packed','Packed','Item placed in its parcel on camera, at the drop-off point.'],
  ['sealed','Sealed','ProofSeal applied — single-use, linked to this order.'],
  ['handedOver','Handed to carrier','Carrier staff acceptance logged against this order.'],
  ['arrivedAtVerifier','Arrived at Verifier Hub','Sealed parcel received by an independent authentication partner.', true],
  ['hubAuthenticated','Independently authenticated',"Checked against reference data by a neutral third party — not the seller or buyer.", true],
  ['secondHubAuthenticated','Second authenticator reviewed',"An independent second hub, blind to the first hub's notes, re-checked the item — required by policy for items over the dual-verification threshold.", true, true],
  ['resealed','Re-sealed for final leg',"Seller's seal retired; a new ProofSeal issued for the journey to the buyer.", true],
  ['shipped','Shipped','Parcel in transit, tracked.'],
  ['delivered','Delivered','Parcel received by the buyer.'],
  ['unboxed','Unboxed','Protected Unboxing recorded; ProofSeal and Item Tag scanned.'],
  ['confirmed','Confirmed','Evidence matched. Funds released to the seller.'],
];

function evidenceIntegrityOk(it){
  let ok = verifySignedLog(state.handover,'log');
  if(it.verifierHub) ok = ok && verifySignedLog(state.verifierHub,'log') && (!dualVerifierRequired(it) || verifySignedLog(state.verifierHub,'secondLog'));
  ok = ok && verifySignedLog(state.unboxing,'log');
  if(it.sealEligible && state.addOns.witnessedPacking) ok = ok && verifySignedLog(state.handover,'attendantLog');
  if(it.sealEligible && state.addOns.witnessedOpening) ok = ok && verifySignedLog(state.unboxing,'courierLog');
  return ok;
}
function weightMismatchFlag(){
  const h = state.handover.weighedKg, u = state.unboxing.weighedKg;
  if(h==null || u==null) return false;
  return Math.abs(h-u) > 0.08;
}

/* ============== PROOF SCORE ==============
   A literal readout of data that already exists elsewhere in state/SELLERS/evidence logs —
   deliberately not a separate "trust rating" invented on top. Weights sum to 100 only when
   every row is applicable to this item's tier; non-applicable rows (e.g. "ProofSeal applied"
   for an Enhanced-tier item that was never sealEligible) are shown greyed out and excluded
   from both the numerator and denominator, rather than counted as a failure. */
const PROOF_CHECKLIST = [
  {key:'sellerVerified', label:'Seller verified', weight:10,
    applicable:()=>true,
    done:(it)=> !!(SELLERS[it.seller] && SELLERS[it.seller].kycVerified)},
  {key:'itemIdCreated', label:'Item ID created', weight:5,
    applicable:()=>true,
    done:(it)=> !!it.itemId},
  {key:'itemPhotographed', label:'Item photographed', weight:10,
    applicable:()=>true,
    done:(it)=> !!(it.photo || it.photographed)},
  {key:'itemAuthenticated', label:'Item authenticated', weight:15,
    applicable:()=>true,
    done:(it)=> !!it.authenticated && (!it.verifierHub || (dualVerifierRequired(it) ? state.timeline.secondHubAuthenticated : state.timeline.hubAuthenticated))},
  {key:'proofSealApplied', label:'ProofSeal applied', weight:15,
    applicable:(it)=> !!it.sealEligible,
    done:()=> !!state.pairing.paired},
  {key:'verifiedHandover', label:'Verified handover completed', weight:15,
    applicable:(it)=> it.tier!=='enhanced',
    done:()=> state.timeline.sealed && state.timeline.handedOver && verifySignedLog(state.handover,'log')},
  {key:'carrierConfirmed', label:'Carrier confirmed', weight:10,
    applicable:()=>true,
    done:()=> !!state.timeline.handedOver},
  {key:'protectedUnboxing', label:'Buyer completed protected unboxing', weight:20,
    applicable:()=>true,
    done:()=> state.timeline.unboxed && verifySignedLog(state.unboxing,'log')},
];
function proofScore(it){
  const rows = PROOF_CHECKLIST.map(c=>{
    const applicable = c.applicable(it);
    const done = applicable && c.done(it);
    return {label:c.label, weight:c.weight, applicable, done};
  });
  const maxPoints = rows.filter(r=>r.applicable).reduce((s,r)=>s+r.weight,0);
  const earned = rows.filter(r=>r.applicable && r.done).reduce((s,r)=>s+r.weight,0);
  const score = maxPoints>0 ? Math.round(earned/maxPoints*100) : 0;
  return {score, rows};
}
function proofScoreHtml(it){
  const {score, rows} = proofScore(it);
  const rowsHtml = rows.map(r=>{
    const cls = !r.applicable ? 'pr-na' : (r.done ? 'pr-done' : 'pr-pending');
    const icon = (r.applicable && r.done) ? iconCheck() : iconDash();
    const note = !r.applicable ? ' <span style="color:var(--muted)">— not applicable at this tier</span>' : '';
    return `<li class="proof-row ${cls}"><span class="pr-icon">${icon}</span><span>${r.label}${note}</span></li>`;
  }).join('');
  return `
  <div class="proof-score">
    <div class="proof-score-head">
      <span class="proof-score-label">Proof Score</span>
      <span class="proof-score-value">${score}<span class="max">/100</span></span>
    </div>
    <p class="proof-score-sub">Computed live from this transaction's actual evidence — seller KYC, listing photos, and the real custody-chain state below — not a static listing badge. <a href="#" onclick="goTo('protection'); return false;">How this is calculated.</a></p>
    <ul class="proof-list">${rowsHtml}</ul>
  </div>`;
}

function renderTimeline(){
  const it = activeItem();
  const steps = TL_STEPS.filter(([,,,hubOnly,dualOnly]) => (!hubOnly || it.verifierHub) && (!dualOnly || dualVerifierRequired(it)));
  let currentMarked = false;
  let doneCount = 0;
  const rows = steps.map(([key,title,desc])=>{
    const done = state.timeline[key];
    if(done) doneCount++;
    const isCurrent = !done && !currentMarked;
    if(isCurrent) currentMarked = true;
    const cls = done ? 'done' : (isCurrent ? 'current' : '');
    return `<div class="tl-row ${cls}"><div class="tl-title">${title}${done?`<span class="tl-time">logged</span>`:''}</div><div class="tl-desc">${desc}</div></div>`;
  }).join('');
  // The fill line's final height is set via a tiny timeout after insertion, not inline on the
  // very same paint -- CSS transitions don't animate from an element's own initial inline value,
  // they need the property to change *after* the element exists in the DOM for the transition
  // to actually be visible rather than jumping straight to the end state.
  const tlFillPct = steps.length ? Math.round((doneCount / steps.length) * 100) : 0;
  setTimeout(()=>{ const el = document.getElementById('tlLineFill'); if(el) el.style.height = tlFillPct + '%'; }, 30);
  const integrityOk = evidenceIntegrityOk(it);
  const weightFlag = weightMismatchFlag();
  return `
  <div class="eyebrow-row"><span class="eyebrow" style="margin:0;">Transaction timeline</span><span class="ref">Order ${it.itemId.replace('IT','PRV')}</span></div>
  <h1 class="page-title">Everything that happened to this item</h1>
  <p class="page-sub">${it.title} — one continuous, timestamped record from listing to confirmation. No step is reconstructed from memory afterwards.</p>
  ${proofScoreHtml(it)}
  <div class="btn-row" style="margin-top:-10px;margin-bottom:16px;">
    <button class="btn btn--ghost" onclick="shareContent('My Proof Score on Provenance', 'My Provenance Proof Score for ${it.title}: ' + proofScore(it).score + '/100 — verified end to end.')">Share my Proof Score</button>
  </div>
  ${state.timeline.confirmed && !integrityOk ? `<div class="panel" style="border-color:var(--seal);background:rgba(156,82,56,0.06);"><p style="margin:0;font-size:13px;color:var(--seal-dark);"><strong>Evidence chain broken.</strong> One or more signed log entries don't match their recorded hash — something was edited after the fact. "Confirmed" would not be shown to a real buyer or seller until this is resolved.</p></div>` : ''}
  ${weightFlag ? `<div class="panel" style="border-color:var(--brass);background:rgba(126,100,80,0.06);"><p style="margin:0;font-size:13px;color:var(--brass);"><strong>Weight mismatch flagged.</strong> Parcel weight at pack (${state.handover.weighedKg}kg) and at delivery (${state.unboxing.weighedKg}kg) differ by more than the tolerance — surfaced automatically, before either side needs to ask.</p></div>` : ''}
  <div class="tl"><div class="tl-line-fill" id="tlLineFill"></div>${rows}</div>
  <p style="font-size:12px;color:var(--muted);margin-top:10px;">"Confirmed" is only shown once every signed evidence log on this order re-verifies against its own hash chain — not asserted by either party's say-so.</p>
  <div class="btn-row">
    ${!state.timeline.handedOver ? `<button class="btn btn--ghost" onclick="goTo('handover')">Continue seller handover</button>`
      : (it.verifierHub && !state.timeline.resealed) ? `<button class="btn btn--ghost" onclick="goTo('verifierhub')">Continue Verifier Hub authentication</button>`
      : !state.timeline.confirmed ? `<button class="btn btn--ghost" onclick="goTo('unboxing')">Continue buyer unboxing</button>`
      : `<button class="btn btn--ghost" onclick="goTo('passport')">View Item Passport</button>`}
  </div>
  `;
}

/* ============== ITEM PASSPORT ============== */
function renderPassport(){
  const it = activeItem();
  const integrityOk = evidenceIntegrityOk(it);
  const owners = it.passportOwners ? [...it.passportOwners] : [
    {label:'Current owner', date:'This transaction', note: state.timeline.confirmed ? (integrityOk ? 'Verified Handover and Protected Unboxing both completed — every signed evidence log re-verifies.' : 'Steps completed, but the evidence chain failed re-verification — flagged, not shown as clean.') : 'Transaction in progress — see the live timeline.'}
  ];
  if(it.verifierHub && state.timeline.hubAuthenticated && integrityOk){
    owners.push({label:'Independent authentication', date:'This transaction', note:`Authenticated by ${hubName(it)}, a party independent of both seller and buyer. The seller's seal was retired on arrival and a new ProofSeal (${state.proofSealB.code}) was issued for the final leg to the buyer.`});
  }
  if(dualVerifierRequired(it) && state.timeline.secondHubAuthenticated && integrityOk){
    owners.push({label:'Second independent authenticator', date:'This transaction', note:`Required because this item is priced over £${DUAL_VERIFIER_THRESHOLD.toLocaleString()}: ${secondHubName(it)} independently re-checked the item, blind to the first hub's notes, before it was repacked.`});
  }
  return `
  <div class="eyebrow">Item Passport</div>
  <h1 class="page-title">${it.title}</h1>
  <p class="page-sub">A persistent record tied to the physical item itself, not to any one sale. If this item is resold, the Passport goes with it.</p>

  <div class="panel">
    <div class="ledger-row"><span class="label">Item ID</span><span class="val">${it.itemId}</span></div>
    <div class="ledger-row"><span class="label">Item Tag</span><span class="val">${(it.tier==='luxury'||it.tier==='ultraLuxury') ? 'NFC + QR' : 'QR only'}</span></div>
    <div class="ledger-row"><span class="label">Authentication</span><span class="val">${it.authenticated ? (it.authNote||'Authenticated') : 'Not authenticated'}</span></div>
    <div class="ledger-row"><span class="label">Flagged incidents</span><span class="val">0</span></div>
  </div>

  ${it.authenticated ? `<p><span class="stamp ${(it.tier==='luxury'||it.tier==='ultraLuxury')?'stamp--brass':'stamp--verified'}">Authenticated</span></p>` : ''}

  <div class="section-head">Ownership chain</div>
  <div class="passport-chain">
    ${owners.map(o=>`<div class="passport-owner"><span class="meta">${o.date}</span><h4>${o.label}</h4><p>${o.note}</p></div>`).join('')}
  </div>
  <p style="font-size:12.5px;color:var(--muted);max-width:60ch;">On resale, this Passport — and its full history — transfers to the next buyer. Over time this builds real provenance for items worth tracking: designer pieces, sneakers, watches, collectibles.</p>
  <p style="font-size:12.5px;color:var(--muted);max-width:60ch;">The Passport covers custody during a transaction, not the gap afterwards. Between a confirmed sale and the next listing, the item is simply with its owner — the next sale's re-verification, scaled to this Passport's own history, is what re-establishes the chain.</p>
  `;
}
