name: Test and deploy
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Upload layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-screenshots
          path: tests/layout-shots/
          retention-days: 14

  # The new Next.js site in web/. Netlify builds and hosts it; this job runs the full checks,
  # including the real-browser layout check that Netlify's build does not run.
  web:
    runs-on: ubuntu-latest
    # Two parallel jobs: the page sweep (every page, width and theme, plus accessibility) and the journeys.
    strategy:
      fail-fast: false
      matrix:
        part: [layout, journeys]
    name: web (${{ matrix.part }})
    defaults:
      run:
        working-directory: web
    # Build and browser-test against the example catalogue, so the checks never depend on live data.
    env:
      PV_DATA_SOURCE: examples
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run tokens
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
        env:
          E2E_PART: ${{ matrix.part }}
      - name: Upload new-site screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-screenshots-${{ matrix.part }}
          path: web/test-results/
          retention-days: 14

  # Publishes app/ to GitHub Pages — only from main, and only if every test passed.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
