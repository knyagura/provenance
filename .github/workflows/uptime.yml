name: Live site check
# Every 30 minutes, checks the live site's key pages load and the database answers. If anything is
# down, this run fails and GitHub emails the repository owner.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE: https://lucky-gnome-de81b6.netlify.app
    steps:
      - name: Pages load
        run: |
          fail=0
          for path in / /search /privacy /sitemap.xml /robots.txt /api/v1; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 20 "$SITE$path")
            if [ "$code" != "200" ]; then echo "::error::$path returned $code"; fail=1; else echo "ok $path"; fi
          done
          curl -s --max-time 20 "$SITE/" | grep -q 'NuTuYu' || { echo "::error::home page doesn't mention NuTuYu"; fail=1; }
          exit $fail
      - name: Database answers
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            -H "apikey: sb_publishable_LTjW96u1jivRuw1QPaSslw_OP-mrKxV" \
            "https://tkjmnivvcrcqkqjywafb.supabase.co/rest/v1/categories?select=slug&limit=1")
          [ "$code" = "200" ] || { echo "::error::Supabase returned $code"; exit 1; }
          echo "ok database"
